name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenJDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify execution environment
        run: |
          set -euo pipefail
          echo "=== Java Compiler ==="
          javac -version
          echo "=== Java Runtime ==="
          java -version
          echo "=== Node.js Runtime ==="
          node -v
          echo "=== npm CLI ==="
          npm -v

      - name: Run test suite
        run: npm test

      - name: Build client and server bundles
        run: npm run build

      - name: Verify Docker container build
        run: docker build -t dwm:ci .
